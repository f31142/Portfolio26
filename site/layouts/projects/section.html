{{ define "title" }}
  {{ .Title }} · {{ .Site.Title }}
{{ end }}
{{ define "content" }}
<section class="container activity-index" aria-labelledby="activity-index-title">
  <header>
    <h1 class="title" id="activity-index-title">{{ .Title }}</h1>
  </header>
  <ul class="activity-card-list">
    {{ range .RegularPages }}
    <li>
      <a class="activity-card" href="{{ .RelPermalink }}">
        <h2 class="activity-card-title">{{ .Title }}</h2>
        {{ with .Params.activity_label }}
        <span class="activity-card-label">{{ . }}</span>
        {{ end }}
        {{ with .Params.activity_summary }}
        <p class="activity-card-summary">{{ . }}</p>
        {{ end }}
      </a>
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
